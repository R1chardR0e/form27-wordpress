name: Package release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          tools: composer:v2
          coverage: none
      - run: npm ci
      - run: composer install --prefer-dist --no-interaction --no-progress
      - run: npm run check
      - run: find wp-content -type f -name '*.php' -print0 | xargs -0 -r -n1 php -l
      - run: composer lint
      - run: npm run package
      - uses: actions/upload-artifact@v4
        with:
          name: form27-release
          path: release/
      - name: Publish tagged GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            release/form27-theme.zip
            release/form27-core.zip
            release/playground-blueprint.json
            release/manifest.json
            release/SHA256SUMS.txt
