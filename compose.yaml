name: form27

services:
  database:
    image: mariadb:11.8
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: ${FORM27_DB_NAME:?Copy .env.example to .env}
      MARIADB_USER: ${FORM27_DB_USER:?Copy .env.example to .env}
      MARIADB_PASSWORD: ${FORM27_DB_PASSWORD:?Set a database password in .env}
      MARIADB_ROOT_PASSWORD: ${FORM27_DB_ROOT_PASSWORD:?Set a root password in .env}
    volumes:
      - form27_database:/var/lib/mysql
    healthcheck:
      test:
        [
          "CMD",
          "healthcheck.sh",
          "--connect",
          "--innodb_initialized",
        ]
      interval: 5s
      timeout: 5s
      retries: 20

  wordpress:
    image: wordpress:7.0-php8.3-apache
    restart: unless-stopped
    depends_on:
      database:
        condition: service_healthy
    ports:
      - "${FORM27_HTTP_PORT:-8080}:80"
    environment:
      WORDPRESS_DB_HOST: database:3306
      WORDPRESS_DB_NAME: ${FORM27_DB_NAME:?Copy .env.example to .env}
      WORDPRESS_DB_USER: ${FORM27_DB_USER:?Copy .env.example to .env}
      WORDPRESS_DB_PASSWORD: ${FORM27_DB_PASSWORD:?Set a database password in .env}
      WORDPRESS_DEBUG: "1"
      WORDPRESS_CONFIG_EXTRA: |
        define( 'WP_ENVIRONMENT_TYPE', 'local' );
        define( 'WP_DEBUG_LOG', true );
        define( 'WP_DEBUG_DISPLAY', false );
        define( 'FORM27_DEMO_MODE', true );
        define( 'FORM27_SMTP_HOST', 'mailpit' );
        define( 'FORM27_SMTP_PORT', 1025 );
    volumes:
      - form27_wordpress:/var/www/html
      - ./wp-content/themes/form27:/var/www/html/wp-content/themes/form27
      - ./wp-content/plugins/form27-core:/var/www/html/wp-content/plugins/form27-core

  cli:
    image: wordpress:cli-php8.3
    depends_on:
      database:
        condition: service_healthy
      wordpress:
        condition: service_started
    user: "33:33"
    environment:
      WORDPRESS_DB_HOST: database:3306
      WORDPRESS_DB_NAME: ${FORM27_DB_NAME:?Copy .env.example to .env}
      WORDPRESS_DB_USER: ${FORM27_DB_USER:?Copy .env.example to .env}
      WORDPRESS_DB_PASSWORD: ${FORM27_DB_PASSWORD:?Set a database password in .env}
    volumes:
      - form27_wordpress:/var/www/html
      - ./wp-content/themes/form27:/var/www/html/wp-content/themes/form27
      - ./wp-content/plugins/form27-core:/var/www/html/wp-content/plugins/form27-core
    entrypoint: ["wp", "--path=/var/www/html"]

  mailpit:
    image: axllent/mailpit:v1.27
    restart: unless-stopped
    ports:
      - "${FORM27_MAILPIT_PORT:-8025}:8025"

volumes:
  form27_database:
  form27_wordpress:
